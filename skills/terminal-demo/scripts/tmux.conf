# The app runs in this tmux. Its status row is blank, in the terminal's own
# background, except for a white block that marker.py turns on and off at each
# subtitle's first key. timeline.py reads the flips from the video, and the
# row is painted over before the subtitles go on.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
# Each demo folder has an env.sh: the made-up HOME, PATH, prompt and locale.
set -g default-command "bash --rcfile /vhs/env.sh"
# Without this, esc waits half a second before the app sees it.
set -g escape-time 0
set -g mouse off
set -g status on
set -g status-position bottom
set -g status-interval 0
set -g status-style "bg=default,fg=default"
set -g status-left-length 20
set -g status-right ""
set -g window-status-format ""
set -g window-status-current-format ""
set -g @mark 0
set -g status-left "#{?#{==:#{@mark},1},#[bg=#ffffff]          #[default],          }"
