<!doctype html>
<!-- Title card. record.py fills the dollar placeholders from demo.json: title, subtitle, background, accent and footer. -->
<html>
<body style="margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:$background;font-family:Inter,sans-serif;color:#fff">
  <div style="text-align:center;max-width:80%">
    <div style="font-size:60px;font-weight:700;line-height:1.15">$title</div>
    <div style="width:96px;height:6px;background:$accent;border-radius:3px;margin:28px auto"></div>
    <div style="font-size:26px;color:#c9dbe4">$subtitle</div>
    <div style="margin-top:56px;font-size:15px;color:#7f97a3">$footer</div>
  </div>
</body>
</html>
